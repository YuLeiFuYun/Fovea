name: Phase 0a

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase0a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout exact verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERIFIED_COMMIT: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64)
          git -c http.extraHeader="AUTHORIZATION: basic $basic" \
            fetch --no-tags --depth=1 origin "$VERIFIED_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$VERIFIED_COMMIT"

      - name: Verify Phase 0a
        env:
          RUN_IOS_SIMULATOR: "1"
        run: scripts/verify-phase0a.sh
