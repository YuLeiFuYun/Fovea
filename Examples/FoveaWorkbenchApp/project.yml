name: FoveaWorkbench
options:
  bundleIdPrefix: dev.fovea
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  Fovea:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
targets:
  FoveaWorkbench:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: FoveaWorkbench
        excludes:
          - Resources
      - path: FoveaWorkbench/Resources
        excludes:
          - LocalMedia
        buildPhase: resources
      - path: FoveaWorkbench/Resources/LocalMedia
        type: folder
        buildPhase: resources
    dependencies:
      - package: Fovea
        product: Fovea
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fovea.workbench
        PRODUCT_NAME: FoveaWorkbench
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fovea Workbench
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - FoveaWorkbenchTests
        - FoveaWorkbenchLiveTests
        - FoveaWorkbenchUITests
      gatherCoverageData: true
  FoveaWorkbenchTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: FoveaWorkbenchTests
    dependencies:
      - target: FoveaWorkbench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fovea.workbench.tests
        GENERATE_INFOPLIST_FILE: YES
  FoveaWorkbenchLiveTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: FoveaWorkbenchLiveTests
        excludes:
          - Info.plist
    dependencies:
      - target: FoveaWorkbench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fovea.workbench.live-tests
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FoveaWorkbenchLiveTests/Info.plist
        FOVEA_RUN_LIVE_NETWORK: "0"
  FoveaWorkbenchUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: FoveaWorkbenchUITests
    dependencies:
      - target: FoveaWorkbench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fovea.workbench.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FoveaWorkbench
